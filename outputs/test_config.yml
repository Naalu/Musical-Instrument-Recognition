experiment:
  name: baseline_densenet121
  description: DenseNet121 baseline with no augmentation
  seed: 42
paths:
  data_dir: data/raw
  checkpoint_dir: checkpoints
  log_dir: logs
data:
  sample_rate: 22050
  num_classes: 11
  classes:
  - cel
  - cla
  - flu
  - gac
  - gel
  - org
  - pia
  - sax
  - tru
  - vio
  - voi
  val_split: 0.15
  test_split: 0.0
  split_by_artist: true
audio:
  sample_rate: 22050
  duration: 3.0
  channels: 1
features:
  type: logmel
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  fmin: 0.0
  fmax: 11025
  window: hann
  power: 2.0
  normalization: standard
augment:
  enabled: false
  pitch_shift:
    enabled: false
  time_stretch:
    enabled: false
  spec_augment:
    enabled: false
model:
  architecture: densenet121
  name: densenet121
  pretrained: true
  dropout: 0.5
  num_classes: 11
  input_height: 128
train:
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  optimizer: adam
  weight_decay: 0.0001
  random_seed: 42
  num_workers: 4
  lr_scheduler: reduce_on_plateau
  lr_patience: 5
  lr_factor: 0.5
  early_stopping: true
  early_stopping_patience: 10
  patience: 10
  save_every: 5
  use_class_weights: true
eval:
  primary_metric: macro_f1
  metrics:
  - accuracy
  - macro_f1
  - per_class_f1
  - confusion_matrix
target:
  macro_f1: 0.6
inference:
  window_size: 3.0
  overlap: 0.5
  aggregation: max
