# Baseline Experiment Configuration
# No data augmentation, max pooling aggregation

experiment:
  name: "baseline_densenet121"
  description: "DenseNet121 baseline with no augmentation (max pooling)"
  seed: 42

data:
  train_dir: "data/IRMAS-TrainingData"
  test_dir: "data/IRMAS-TestingData-Part1"
  sample_rate: 22050
  channels: 1  # mono
  num_classes: 11
  classes:
    - "cel"  # cello
    - "cla"  # clarinet
    - "flu"  # flute
    - "gac"  # acoustic guitar
    - "gel"  # electric guitar
    - "org"  # organ
    - "pia"  # piano
    - "sax"  # saxophone
    - "tru"  # trumpet
    - "vio"  # violin
    - "voi"  # voice
  
  # Data split (track-level to prevent leakage)
  val_split: 0.15  # 15% of training data for validation
  split_by_artist: true  # Prevent artist leakage

features:
  type: "logmel"
  n_mels: 128
  n_fft: 1024
  hop_length: 512
  fmin: 0
  fmax: 8000
  window: "hann"
  power: 2.0  # For power spectrogram
  
  # Normalization
  normalization: "standard"  # per-sample standardization (mean=0, std=1)

augment:
  enabled: false  # NO augmentation for baseline
  pitch_shift:
    enabled: false
  time_stretch:
    enabled: false
  spec_augment:
    enabled: false

model:
  architecture: "densenet121"
  pretrained: true  # ImageNet weights
  num_classes: 11
  dropout: 0.5
  input_height: 128  # Must match features.n_mels
  input_width: null  # Variable (depends on audio length)

train:
  batch_size: 32
  num_epochs: 50
  learning_rate: 0.0001
  optimizer: "adam"
  weight_decay: 0.0001
  
  # Learning rate schedule
  lr_scheduler: "reduce_on_plateau"
  lr_patience: 5
  lr_factor: 0.5
  
  # Early stopping
  early_stopping: true
  patience: 10
  
  # Class weighting (for imbalanced dataset)
  use_class_weights: true

eval:
  primary_metric: "macro_f1"
  metrics:
    - "accuracy"
    - "macro_f1"
    - "per_class_f1"
    - "confusion_matrix"

inference:
  window_size: 3.0  # seconds
  overlap: 0.5  # 50% overlap
  aggregation: "max"  # max pooling (baseline)